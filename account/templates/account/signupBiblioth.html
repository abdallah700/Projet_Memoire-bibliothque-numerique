{% extends 'account/base.html' %}

{% block title %}Inscription Bibliothecaire Interne{% endblock %}

{% block header %}Sign Up Page{% endblock %}
    


{% block content %} 
<!-- contenu de visiteur.html -->
<h3>Inscription Bibliothecaire Interne</h3>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  <div class="d-flex justify-content-end mt-3">
    <button type="submit" class="btn btn-primary">Add</button>
  </div>
  <div class="table-responsive">
    <table class="table">
      {{ Bibliotheque_form.as_table }}
    </table>
  </div>
</form>

{% endblock %}
