<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}E-BookUNH{% endblock %}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.21/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.21/css/dataTables.bootstrap4.min.css">
    <style>
        .navbar-brand {
            font-weight: bold;
        }
        .sidebar {
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 200px;
            background-color: #343a40;
            color: white;
            padding-top: 20px;
        }
        .sidebar a {
            color: white;
            padding: 10px;
            display: block;
            text-decoration: none;
        }
        .sidebar a:hover {
            background-color: #495057;
        }
        .content {
            margin-left: 210px;
            padding: 20px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <a class="navbar-brand" href="#">E-BookUNH</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'fiche_list' %}"><i class="fas fa-home"></i> Accueil</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'fiche_create' %}"><i class="fas fa-plus-circle"></i> Créer une fiche</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'statistics' %}"><i class="fas fa-chart-bar"></i> Statistiques Fiche</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'cons_statistics' %}"><i class="fas fa-chart-bar"></i> Statistiques Consultation</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#"><i class="fas fa-file-alt"></i> Rapport</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="sidebar">
        <a class="navbar-brand mr-1 text-primary" href="">E-Book-UNH</a>
        <a href="{% url 'fiche_list' %}"><i class="fas fa-home"></i> Accueil</a>
        <a href="{% url 'fiche_create' %}"><i class="fas fa-plus-circle"></i> Créer une fiche</a>
        <a class="nav-link" href="{% url 'import_cote' %}"><i class="fas fa-plus-circle"></i> Import Cote</a>
        <a class="nav-link" href="{% url 'import_discipline' %}"><i class="fas fa-plus-circle"></i> Import Discipline</a>
        <a href="{% url 'statistics' %}"><i class="fas fa-chart-bar"></i> Statistiques Fiche</a>
        <a class="nav-link" href="{% url 'cons_statistics' %}"><i class="fas fa-chart-bar"></i> Statistiques Consultation</a>
        <a href="#"><i class="fas fa-file-alt"></i> Rapport</a>
    </div>

    <div class="content">
        {% block body %}
        {% endblock %}
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.21/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.21/js/dataTables.bootstrap4.min.js"></script>
</body>
</html>
