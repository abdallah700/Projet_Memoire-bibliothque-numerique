{% extends 'base.html' %}
{% load static %}

{% block body %}
<h1>Statistiques</h1>
<canvas id="myChart" width="400" height="200"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function() {
        $.ajax({
            url: '{% url "get_statistics_data" %}',
            success: function(data) {
                const labels = [];
                const hommes = [];
                const femmes = [];

                data.forEach(item => {
                    const monthYear = new Date(item.month).toLocaleString('default', { month: 'long', year: 'numeric' });
                    const label = `${monthYear} - ${item.annee_academique} - ${item.promotion_filiere}`;
                    if (!labels.includes(label)) {
                        labels.push(label);
                    }

                    if (item.genre === 'M') {
                        hommes.push(item.total);
                    } else if (item.genre === 'F') {
                        femmes.push(item.total);
                    }
                });

                const ctx = document.getElementById('myChart').getContext('2d');
                const myChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Hommes',
                                data: hommes,
                                backgroundColor: 'rgba(54, 162, 235, 0.2)',
                                borderColor: 'rgba(54, 162, 235, 1)',
                                borderWidth: 1
                            },
                            {
                                label: 'Femmes',
                                data: femmes,
                                backgroundColor: 'rgba(255, 99, 132, 0.2)',
                                borderColor: 'rgba(255, 99, 132, 1)',
                                borderWidth: 1
                            }
                        ]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            },
            error: function(error) {
                console.error('Error fetching data:', error);
            }
        });
    });
</script>
{% endblock %}
